name: CI

on:
  push:
    branches: [main]

  pull_request: # run on all PRs

jobs:
  lint:
    name: Lint

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: nubjs/setup-nub@v0
        with:
          node-version-file: .node-version
          cache: false

      - name: Install dependencies
        run: nub ci --ignore-scripts

      - name: Lint JS-like files
        run: nubx eslint .  --max-warnings 0

  typecheck:
    name: Typecheck

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: nubjs/setup-nub@v0
        with:
          node-version-file: .node-version
          cache: false

      - name: Install dependencies
        run: nub ci --ignore-scripts

      - name: Check types
        run: nubx astro check --minimumFailingSeverity warning
